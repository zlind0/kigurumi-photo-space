# Kig Photo Space — Nginx 反向代理示例
#
# 应用只监听 127.0.0.1:3000。Nginx 负责 TLS、HTTP/2、压缩和静态资源缓存。
# 将 photos.example.com 替换为你的域名，并用 certbot 或自己的证书配置 TLS。

upstream kig_photo_space {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name photos.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name photos.example.com;

    ssl_certificate     /etc/letsencrypt/live/photos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传全图最大 50MB，留一点 multipart 余量。
    client_max_body_size 60m;
    client_body_timeout 60s;

    # 安全头由应用发送；Nginx 只补 HSTS（应用在 COOKIE_SECURE=true 时也会发）。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 压缩只用于文本资源；AVIF 不压缩。
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        proxy_pass http://kig_photo_space;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 应用已经发送 immutable 缓存头；这里只做代理缓存（可选）。
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://kig_photo_space;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # 上传是流式写盘，不需要缓冲整个请求体。
        proxy_request_buffering off;
    }
}
